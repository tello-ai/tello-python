[project]
name = "tello-ai-sdk"
dynamic = ["version"]
description = "Tello SDK for Python — WebSocket realtime client for turn-provider-gateway"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tello" }]
keywords = ["tello", "voice", "telephony", "websocket", "realtime", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "websockets>=14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://telloai.io"
Repository = "https://github.com/tello-ai/tello-python"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tello/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tello"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
