[project]
name = "tello-sdk"
dynamic = ["version"]
description = "Tello SDK for Python — WebSocket realtime client for turn-provider-gateway"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tello" }]
keywords = ["tello", "voice", "telephony", "websocket", "realtime", "sdk"]
dependencies = [
  "websockets>=13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://tello.ai"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tello/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tello"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
